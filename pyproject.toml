[project]
name = "vtree"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "John Burnett", email = "github@johnburnett.com"},
]
dependencies = [
    "sparse-file>=0.0.2",
    "rich>=13.7.1",
    "tqdm>=4.66.4",
]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
compress_subdirs = "vtree.compress_subdirs:main"
estimate_compression = "vtree.estimate_compression:main"
mirror = "vtree.mirror:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"
